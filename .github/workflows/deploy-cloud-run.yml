name: Deploy to Cloud Run (deprecated)

# Deploy yolu artik Cloud Build (cloudbuild.yaml).
# Bu workflow bilerek disabled; gerekirse workflow_dispatch ile manuel acilabilir.

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'abd-erstellung' }}
  REPO: ${{ vars.ARTIFACT_REPO || 'abd-erstellung' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit --config cloudbuild.yaml \
            --substitutions=_REGION=${{ env.REGION }},_SERVICE=${{ env.SERVICE }},_REPO=${{ env.REPO }} \
            .
